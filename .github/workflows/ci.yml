name: CI

on:
  push:
    # Per-version branches (17.0, 18.0, ...) get the same CI as main so a
    # direct push -- e.g. a security backport -- runs the full check set.
    branches: [main, develop, "*.0"]
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pinned to match .pre-commit-config.yaml's `rev: v0.4.4` so CI and
        # the local pre-commit hook always agree — an unpinned install here
        # previously let a new ruff release (which added default-enabled
        # rules) turn CI red with no code change and no local repro.
        run: pip install ruff==0.4.4
      - name: Check formatting
        run: ruff format --check odoopilot/
      - name: Lint
        run: ruff check odoopilot/

  xml-check:
    name: XML well-formed check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check XML files
        run: |
          python3 - <<'EOF'
          import sys, xml.etree.ElementTree as ET, pathlib

          errors = []
          for path in pathlib.Path("odoopilot").rglob("*.xml"):
              try:
                  ET.parse(path)
              except ET.ParseError as e:
                  errors.append(f"{path}: {e}")

          if errors:
              print("XML parse errors found:")
              for err in errors:
                  print(" ", err)
              sys.exit(1)
          else:
              print(f"All XML files are well-formed ({len(list(pathlib.Path('odoopilot').rglob('*.xml')))} files checked).")
          EOF

  odoo-tests:
    # Everything under odoopilot/tests/ is an Odoo ``TransactionCase``: it
    # needs a real Odoo installation and a PostgreSQL database, so plain
    # ``pytest`` cannot collect it (the import of ``odoo`` fails). This job
    # stands up both and runs the module's own test suite, which is the
    # only place those 144 tests execute.
    name: Odoo module tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          path: addon

      - uses: actions/setup-python@v5
        with:
          # Odoo 17/18 do not support 3.12+; 3.11 is the newest they run on.
          python-version: "3.11"

      - name: Resolve the Odoo series from the manifest
        id: series
        # The manifest version is "<odoo-series>.<module-version>", e.g.
        # 17.0.26.0.0 -> 17.0. This keeps the 17.0 and 18.0 branches on
        # their own Odoo without a second workflow.
        run: |
          series=$(python3 -c "import ast;print(ast.literal_eval(open('addon/odoopilot/__manifest__.py').read())['version'].split('.')[0])").0
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "Testing against Odoo $series"

      - name: System packages Odoo needs to build its wheels
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libldap2-dev libsasl2-dev libxml2-dev libxslt1-dev libjpeg-dev

      - name: Check out Odoo ${{ steps.series.outputs.series }}
        run: |
          git clone --depth 1 --branch "${{ steps.series.outputs.series }}" \
            https://github.com/odoo/odoo.git "$RUNNER_TEMP/odoo"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: odoo-${{ steps.series.outputs.series }}-pip-${{ hashFiles('**/odoo/requirements.txt') }}

      - name: Install Odoo
        run: pip install -r "$RUNNER_TEMP/odoo/requirements.txt"

      - name: Run the module test suite
        # --test-tags /odoopilot restricts the run to this module's own
        # tests. Without it --test-enable also runs the test suites of every
        # dependency being installed (web, mail, base_setup), and a flaky
        # core test -- e.g. web's TestReports.test_report_session_cookie --
        # fails a build that has nothing to do with this addon.
        #
        # Odoo logs failures but its exit code has historically been
        # unreliable, so the log is scanned too: any ERROR/CRITICAL from the
        # odoopilot module or a failed-test summary fails the job even if
        # odoo-bin exits 0.
        run: |
          set -o pipefail
          "$RUNNER_TEMP/odoo/odoo-bin" \
            --database=test_odoopilot \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --addons-path="$RUNNER_TEMP/odoo/addons,$GITHUB_WORKSPACE/addon" \
            --init=odoopilot \
            --test-enable \
            --test-tags=/odoopilot \
            --stop-after-init \
            --log-level=test \
            2>&1 | tee odoo-test.log
          if grep -qE "(CRITICAL|ERROR) .*odoo\.(addons\.odoopilot|modules\.(registry|loading))" odoo-test.log; then
            echo "::error::Module failed to install or its tests errored -- see the log above."
            exit 1
          fi
          if grep -qE "odoo\.addons\.odoopilot.*: [1-9][0-9]* (failures|errors)" odoo-test.log; then
            echo "::error::odoopilot tests reported failures -- see the log above."
            exit 1
          fi
          echo "Module installed and its test suite passed."

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-test-log-${{ steps.series.outputs.series }}
          path: odoo-test.log
          if-no-files-found: warn

  listing-renderable:
    name: App Store listing renderable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint listing for App Store sanitiser compatibility
        # Catches the three patterns the App Store HTML sanitiser breaks:
        # background declarations (stripped silently), white text (invisible
        # once the matching dark background is stripped), and styled <a>
        # tags (rewritten to non-clickable <span href>).
        run: python3 scripts/check_listing_rendering.py

  security-scan:
    name: Static security scan
    runs-on: ubuntu-latest
    # Continue running other jobs even if a finding lands so a noisy false
    # positive cannot block an unrelated PR. Real findings still surface in
    # the job log; the goal here is ongoing visibility rather than a hard
    # gate. Tighten to a hard gate once the rule set is tuned.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners
        run: pip install bandit semgrep
      - name: bandit
        # -ll = report Medium and High severity only; skip Low (mostly noise
        # like "subprocess used"). -ii = same threshold for confidence.
        # Excludes test files because security tests deliberately exercise
        # patterns that look risky in isolation (e.g. fixtures with weak
        # secrets).
        run: bandit -r odoopilot -x odoopilot/tests -ll -ii
      - name: semgrep
        # Default config covers OWASP Top 10 + common Python pitfalls.
        # --error makes a real finding fail the job (caught by
        # continue-on-error at the job level so it stays advisory until we
        # tune the rule set).
        run: semgrep --config=auto --error --skip-unknown-extensions odoopilot
